name: Continuous Integration & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Lint & Typecheck Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"
      - name: Run Ruff Linter & Format Check
        run: |
          ruff check .
      - name: Run Mypy Type Checking
        run: |
          python -m mypy app

  test:
    name: Test Suite & Verification Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Pytest Verification Suite
        env:
          INFERENCE_API_KEY: "test_ci_integration_key"
        run: |
          pytest -ra -q tests/
      - name: Build & Package Validation
        run: |
          pip install build
          python -m build
