name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run Test Suite
        run: |
          pytest -q tests/

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: |
          docker build -t ai-universe:${{ github.sha }} .
      - name: Deploy to Staging & Smoke Test
        run: |
          echo "Deploying ${{ github.sha }} to staging cluster..."
      - name: Promote to Production (Rolling Update)
        run: |
          echo "Executing zero-downtime rolling update on production cluster..."
